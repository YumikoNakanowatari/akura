<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安倉バレーボールクラブ</title>

  <style>
    :root{
      --maxw: 1200px;
      --gap: 8px;
      --radius: 8px;
      --pad: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --fg: #222;
      --muted: #666;
      --bg: #fafafa;
      --card: #fff;
      --accent: #2563eb;
      --subaccent: #2d8be8;
      --minw: 220px;
      --tap: 44px;
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    header{
      max-width: var(--maxw);
      margin: 12px auto 6px;
      padding: 0 10px;
    }

    h1{ margin:0; font-size: clamp(18px, 2.2vw, 22px); }
    .lead{ margin:0; color: var(--muted); font-size: 13px; }

    /* ===== toolbar ===== */
    .toolbar{
      max-width: var(--maxw);
      margin: 0 auto 8px;
      padding: 0 10px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
    }
    .toolbar label{
      font-size:13px;
      display:flex;
      gap:6px;
      align-items:center;
    }
    .toolbar select{
      min-height: var(--tap);
      padding:6px 8px;
      font-size:14px;
    }
    .count{
      color: var(--muted);
      font-size:13px;
      margin-left:auto;
    }

    /* ===== grid ===== */
    .grid{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 8px 14px;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--minw), 1fr));
      gap: var(--gap);
    }

    .card{
      background: var(--card);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: var(--shadow);
      cursor:pointer;
    }

    .media-wrapper img{
      width:100%;
      display:block;
    }

    .caption{
      padding: var(--pad);
      font-size:14px;
    }
    .caption-title{
      font-weight:600;
      margin-bottom:2px;
    }
    .caption-desc{
      font-size:13px;
      color: var(--muted);
    }

    /* ===== pager ===== */
    .pager{
      max-width: var(--maxw);
      margin: 6px auto 12px;
      padding: 0 10px;
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .pager a,.pager span{
      border:1px solid #dcdfe3;
      padding:10px 12px;
      border-radius:8px;
      text-decoration:none;
      color:#344054;
      min-height: var(--tap);
      display:inline-flex;
      align-items:center;
    }
    .pager .active{
      background: var(--accent);
      color:#fff;
      border-color: var(--accent);
    }
    .pager .disabled{
      opacity:.4;
      pointer-events:none;
    }

    /* ===== lightbox ===== */
    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.9);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:100;
    }
    .lightbox.open{ display:flex; }
    .lightbox img{
      max-width:96vw;
      max-height:90vh;
      border-radius:8px;
    }
    .lightbox button{
      position:absolute;
      top:20px;
      right:20px;
      font-size:24px;
      background:#000;
      color:#fff;
      border:none;
      padding:8px 12px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>安倉バレーボールクラブでの挑戦と成長の日々</h1>
  <p class="lead">安倉VCでの仲間と共に歩んだ日々の記録です</p>
</header>

<!-- ▼ カテゴリ UI（ドロップダウン） -->
<div class="toolbar">
  <label>
    カテゴリ
    <select id="js-cat-select"></select>
  </label>

  <label id="js-subcat-wrap" style="display:none;">
    サブカテゴリ
    <select id="js-subcat-select"></select>
  </label>

  <div class="count" id="js-count">読み込み中…</div>
</div>

<main class="grid" id="js-grid"></main>
<nav class="pager" id="js-pager"></nav>

<div class="lightbox" id="lightbox">
  <button id="lbClose">✕</button>
  <div id="lbContent"></div>
</div>

<script>
/* ===== 既存 JS（必要最小限で整理） ===== */

const BASE_URL = 'https://pub-cd6be0076e2e47c7b2f39e945c90c0b8.r2.dev/';
let mediaData = [];

const grid = document.getElementById('js-grid');
const pager = document.getElementById('js-pager');
const count = document.getElementById('js-count');

const catSelect = document.getElementById('js-cat-select');
const subcatSelect = document.getElementById('js-subcat-select');
const subcatWrap = document.getElementById('js-subcat-wrap');

let currentPage = 1;
let pageSize = 24;
let currentCat = 'all';
let currentSubcat = 'all';

function labelCat(c){ return c === 'all' ? 'すべて' : c; }

/* ===== カテゴリ select ===== */
function renderCatSelect(){
  catSelect.innerHTML = '';
  const cats = ['all', ...new Set(mediaData.map(d => d.category))];

  cats.forEach(c=>{
    const o = document.createElement('option');
    o.value = c;
    o.textContent = labelCat(c);
    o.selected = c === currentCat;
    catSelect.appendChild(o);
  });
}

/* ===== サブカテゴリ select ===== */
function renderSubcatSelect(){
  subcatSelect.innerHTML = '';

  if(currentCat === 'all'){
    subcatWrap.style.display = 'none';
    return;
  }

  const map = new Map();
  mediaData
    .filter(d => d.category === currentCat)
    .forEach(d=>{
      (d.subcategoriesText || []).forEach(s=>{
        if(!map.has(s.toLowerCase())) map.set(s.toLowerCase(), s);
      });
    });

  if(map.size === 0){
    subcatWrap.style.display = 'none';
    return;
  }

  subcatWrap.style.display = '';

  const all = document.createElement('option');
  all.value = 'all';
  all.textContent = 'すべて';
  subcatSelect.appendChild(all);

  for(const [k,v] of map){
    const o = document.createElement('option');
    o.value = k;
    o.textContent = v;
    o.selected = k === currentSubcat;
    subcatSelect.appendChild(o);
  }
}

/* ===== 描画 ===== */
function render(){
  renderCatSelect();
  renderSubcatSelect();

  let filtered = mediaData;
  if(currentCat !== 'all'){
    filtered = filtered.filter(d => d.category === currentCat);
  }
  if(currentSubcat !== 'all'){
    filtered = filtered.filter(d => d.subcategories.includes(currentSubcat));
  }

  count.textContent = `${filtered.length} 件`;

  grid.innerHTML = '';
  filtered.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="media-wrapper">
        <img src="${item.thumb || item.src}">
      </div>
      <div class="caption">
        <div class="caption-title">${item.title}</div>
        <div class="caption-desc">${item.categoryText}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ===== イベント ===== */
catSelect.addEventListener('change',()=>{
  currentCat = catSelect.value;
  currentSubcat = 'all';
  render();
});
subcatSelect.addEventListener('change',()=>{
  currentSubcat = subcatSelect.value;
  render();
});

/* ===== CSV 読み込み（簡略） ===== */
fetch(BASE_URL + 'data.csv')
  .then(r=>r.text())
  .then(text=>{
    const rows = text.split('\n').slice(1);
    mediaData = rows.map(r=>{
      const c = r.split(',');
      return {
        category: (c[4]||'').toLowerCase(),
        categoryText: c[4]||'',
        subcategories: [c[5]?.toLowerCase()].filter(Boolean),
        subcategoriesText: [c[5]].filter(Boolean),
        title: c[2]||'',
        src: BASE_URL + c[0],
        thumb: BASE_URL + c[0]
      };
    });
    render();
  });
</script>

</body>
</html>
